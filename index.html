<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Spin & Win</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08111f;
            color: white;
            min-height: 100vh;
        }

        header {
            background: #111d33;
            padding: 18px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 26px;
            font-weight: bold;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
        }

        .hero {
            text-align: center;
            padding: 70px 20px 30px;
        }

        .hero h1 {
            font-size: 48px;
            margin-bottom: 15px;
        }

        .hero p {
            color: #b8c4d9;
            font-size: 18px;
        }

        .game {
            width: min(900px, 92%);
            margin: 30px auto 70px;
            background: #111d33;
            border-radius: 18px;
            padding: 35px;
            text-align: center;
        }

        .wallet {
            display: inline-block;
            background: #192945;
            padding: 15px 25px;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .wallet span {
            display: block;
            color: #aebbd0;
            margin-bottom: 5px;
        }

        .wallet strong {
            font-size: 25px;
        }

        .wheel-area {
            position: relative;
            width: 360px;
            height: 360px;
            margin: 20px auto;
        }

        .wheel {
            width: 360px;
            height: 360px;
            border-radius: 50%;
            border: 12px solid #263754;

            background:
                conic-gradient(
                    #e74c3c 0deg 45deg,
                    #f1c40f 45deg 90deg,
                    #2ecc71 90deg 135deg,
                    #3498db 135deg 180deg,
                    #9b59b6 180deg 225deg,
                    #e67e22 225deg 270deg,
                    #1abc9c 270deg 315deg,
                    #34495e 315deg 360deg
                );

            transition: transform 4s cubic-bezier(.17,.67,.12,.99);
            box-shadow: 0 0 30px rgba(0,0,0,.5);
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 18px solid transparent;
            border-right: 18px solid transparent;
            border-top: 35px solid white;
            z-index: 2;
        }

        .spin-button {
            border: none;
            background: #16a765;
            color: white;
            font-size: 20px;
            font-weight: bold;
            padding: 16px 50px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 25px;
        }

        .spin-button:hover {
            background: #138d55;
        }

        .spin-button:disabled {
            background: #555;
            cursor: not-allowed;
        }

        #result {
            min-height: 35px;
            margin-top: 25px;
            font-size: 20px;
            font-weight: bold;
        }

        .notice {
            margin-top: 25px;
            color: #aebbd0;
            font-size: 14px;
        }

        footer {
            text-align: center;
            background: #111d33;
            padding: 25px;
            color: #8493aa;
        }

        @media (max-width: 500px) {
            .hero h1 {
                font-size: 36px;
            }

            .game {
                padding: 20px;
            }

            .wheel-area,
            .wheel {
                width: 280px;
                height: 280px;
            }
        }
    </style>
</head>

<body>

</script>

</body>
</html>
